[Processor]
Name=Unzip
Description=Unpacks zipped PS1 games and ROMs
Author=AutoBleem team
Version=1.0.0
Exec=bin/{key}/unzip
; the whole Games tree before every scan, and one ROM at a time
Kinds=games-folder,rom
Match=*.zip
; arcade sets stay zipped - unzip answers --ismine "no" for them itself
Systems=
Order=10
Timeout=120
Modifies=true
