[Processor]
Name=Unzip
Description=Unpacks PS1 games and ROMs from .zip, .7z and .rar
Author=AutoBleem team
Version=1.1.0
Exec=bin/{key}/unzip
; the whole Games tree before every scan, and one ROM at a time
Kinds=games-folder,rom
Match=*.zip;*.7z;*.rar
; arcade sets stay packed - unzip answers --ismine "no" for them itself, and for a later volume of a RAR set
Systems=
Order=10
Timeout=120
Modifies=true
